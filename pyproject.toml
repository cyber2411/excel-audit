[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-audit"
version = "0.1.0"
description = "Workbook health checker: broken refs, inconsistent column formulas, volatile functions, sheet stats."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Syed Areeb Ali" }]
dependencies = ["openpyxl>=3.1"]

[project.scripts]
excel-audit = "excel_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
